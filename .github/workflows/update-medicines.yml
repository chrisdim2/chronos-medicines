name: Update medicines.json

# Τρέχει αυτόματα κάθε Δευτέρα (και με το χέρι από την καρτέλα Actions).
# Ελέγχει το δελτίο τιμών του Υπουργείου, και αν βγήκε νέο πλήρες δελτίο,
# ξαναφτιάχνει το medicines.json και το ανεβάζει (commit) στο repo.
#
# ΣΗΜΕΙΩΣΗ ΓΙΑ ΤΙΣ ΑΠΟΤΥΧΙΕΣ: το build_medicines.py ξεχωρίζει πλέον το
# «η πηγή είναι προσωρινά κάτω» (τελειώνει ήσυχα, πράσινο) από το «άλλαξε η
# δομή της πηγής» (κόκκινο). Άρα ένα κόκκινο Χ εδώ σημαίνει πάντα ότι
# χρειάζεται να μπει άνθρωπος, ποτέ ότι το moh.gov.gr είχε κακή μέρα.
on:
  schedule:
    - cron: "0 6 * * 1"     # κάθε Δευτέρα 06:00 UTC
  workflow_dispatch: {}      # και χειροκίνητα, από το κουμπί "Run workflow"

permissions:
  contents: write            # ώστε το job να μπορεί να κάνει commit/push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 και όχι v4: το v4 τρέχει σε Node.js 20, που έχει αποσυρθεί και
      # βγάζει προειδοποίηση σε κάθε εκτέλεση.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Εγκατάσταση βιβλιοθηκών
        run: pip install requests pandas openpyxl

      # ΠΡΟΣΩΡΙΝΟ (26/10/2026): το moh.gov.gr δίνει 421 στα runners ενώ από Mac δίνει 200.
      # Τυπώνει τι απαντά η πηγή (κεφαλίδες, αρχή σώματος) με τις κεφαλίδες του script,
      # χωρίς το Connection, και με curl (HTTP/2 και HTTP/1.1). Σβήνεται μόλις βρεθεί η αιτία.
      - name: Διάγνωση 421 (προσωρινό)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import requests
          from build_medicines import HEADERS, LISTING_URL
          lean = {k: v for k, v in HEADERS.items() if k != "Connection"}
          for label, h in (("κεφαλίδες script", HEADERS), ("χωρίς Connection", lean), ("χωρίς κεφαλίδες", None)):
              try:
                  r = requests.get(LISTING_URL, headers=h, timeout=30)
                  print(f"== requests, {label}: HTTP {r.status_code} {r.reason}")
                  print(dict(r.headers))
                  print(r.text[:500].replace("\n", " "))
              except Exception as e:
                  print(f"== requests, {label}: {e!r}")
          EOF
          for v in "" "--http1.1"; do
            echo "== curl $v"
            curl -s $v -m 30 -o /dev/null -D - -A "Mozilla/5.0" "https://www.moh.gov.gr/articles/times-farmakwn/deltia-timwn" | head -15
          done

      - name: Δημιουργία medicines.json
        run: python build_medicines.py medicines.json

      - name: Commit αν άλλαξε
        run: |
          git config user.name "medicines-bot"
          git config user.email "actions@users.noreply.github.com"
          git add medicines.json
          if git diff --staged --quiet; then
            echo "Καμία αλλαγή στο medicines.json."
          else
            git commit -m "Auto-update medicines.json ($(date +%F))"
            git push
          fi
